name: Build Wakeel Hesabat v7 live test APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack current project
        run: |
          mkdir -p android-project
          unzip -q wakeel-hesabat-group-discount-source.zip -d android-project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test reaction association
        run: |
          cd android-project
          mkdir -p test-classes
          javac -d test-classes app/src/main/java/com/wakeel/hesabat/AccountMessage.java app/src/main/java/com/wakeel/hesabat/ReactionMatcher.java tests/ReactionMatcherTest.java
          java -cp test-classes com.wakeel.hesabat.ReactionMatcherTest
      - name: Build APK
        run: gradle -p android-project assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wakeel-hesabat-v7-live-test-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
