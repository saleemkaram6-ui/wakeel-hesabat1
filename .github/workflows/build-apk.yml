name: Build Wakeel Hesabat test APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack current project
        run: |
          mkdir -p android-project
          unzip -q wakeel-hesabat-group-discount-source.zip -d android-project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android-project assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wakeel-hesabat-test-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
