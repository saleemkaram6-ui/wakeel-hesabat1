name: Build Rasid v7.5.2 APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Rasid v7.5.2 project
        run: |
          mkdir -p android-project
          unzip -q rasid-v7-5-2-toolbar-source.zip -d android-project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test message parsing and identity
        run: |
          cd android-project
          mkdir -p test-classes
          javac -d test-classes app/src/main/java/com/wakeel/hesabat/AccountMessage.java app/src/main/java/com/wakeel/hesabat/ReactionMatcher.java app/src/main/java/com/wakeel/hesabat/MessageIdentity.java tests/ReactionMatcherTest.java tests/NotificationPreviewTest.java tests/MessageIdentityTest.java
          java -cp test-classes com.wakeel.hesabat.ReactionMatcherTest
          java -cp test-classes com.wakeel.hesabat.NotificationPreviewTest
          java -cp test-classes com.wakeel.hesabat.MessageIdentityTest
      - name: Build APK
        run: gradle -p android-project assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rasid-v7-5-2-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
